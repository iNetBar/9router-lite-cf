name = "9router-lite"
compatibility_date = "2024-09-01"
pages_build_output_dir = "."

# D1 数据库 binding
# 部署前先创建数据库：wrangler d1 create 9router-lite-db
# 然后将下方 database_id 替换为返回的 ID
[[d1_databases]]
binding = "DB"
database_name = "9router-lite-db"
database_id = "faed7b1e-5465-44ff-8ffc-79c00dc4552b"

# 环境变量（敏感信息用 wrangler pages secret 设置，勿提交明文）
# wrangler pages secret put ENCRYPTION_KEY
[vars]
# ENCRYPTION_KEY = "32字节十六进制密钥"  # 建议用 secret 设置而非写在此处
