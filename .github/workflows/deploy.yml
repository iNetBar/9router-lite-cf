name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Setup D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          # 去除可能的空白字符
          CLOUDFLARE_API_TOKEN="$(echo "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          CLOUDFLARE_ACCOUNT_ID="$(echo "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"

          # 诊断输出
          echo "=== 诊断 ==="
          echo "CF_API_TOKEN 长度: ${#CLOUDFLARE_API_TOKEN}"
          echo "CF_ACCOUNT_ID: $CLOUDFLARE_ACCOUNT_ID"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CF_API_TOKEN 为空！GitHub Secret 名称必须是 CF_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CF_ACCOUNT_ID 为空！GitHub Secret 名称必须是 CF_ACCOUNT_ID"
            exit 1
          fi

          # 验证 Token 有效性
          VERIFY=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")
          echo "Token 验证: $VERIFY"

          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          # 1. 优先使用 D1_DATABASE_ID secret
          DB_ID="$D1_DATABASE_ID"

          # 2. 其次检查 wrangler.toml
          if [ -z "$DB_ID" ]; then
            DB_ID=$(grep -oP 'database_id\s*=\s*"\K[^"]+' wrangler.toml || echo "")
            if [ "$DB_ID" = "在此填入你的数据库ID" ]; then DB_ID=""; fi
          fi

          NEED_COMMIT="no"

          if [ -z "$DB_ID" ]; then
            # 3. 用 Cloudflare API 查询已有数据库
            echo "Querying existing D1 databases ..."
            curl -s -H "$AUTH" "$API" -o /tmp/d1_list.json
            python3 -c "
              import json
              with open('/tmp/d1_list.json') as f:
                  data = json.load(f)
              if not data.get('success'):
                  print(f\"API error: {data.get('errors')}\")
              else:
                  dbs = data.get('result', [])
                  print(f'Found {len(dbs)} databases:')
                  for d in dbs:
                      print(f\"  - {d.get('name')} : {d.get('uuid')}\")
                  match = [d for d in dbs if d.get('name') == '9router-lite-db']
                  if match:
                      with open('/tmp/d1_id.txt', 'w') as f:
                          f.write(match[0]['uuid'])
            " 2>&1
            DB_ID=$(cat /tmp/d1_id.txt 2>/dev/null || echo "")

            if [ -n "$DB_ID" ]; then
              echo "Found existing D1: $DB_ID"
            else
              # 4. 不存在则创建
              echo "Creating D1 database ..."
              curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
                "$API" -d '{"name":"9router-lite-db"}' -o /tmp/d1_create.json
              python3 -c "
                import json
                with open('/tmp/d1_create.json') as f:
                    data = json.load(f)
                print(json.dumps(data, indent=2)[:500])
                if data.get('success'):
                    with open('/tmp/d1_id.txt', 'w') as f:
                        f.write(data.get('result', {}).get('uuid', ''))
              " 2>&1
              DB_ID=$(cat /tmp/d1_id.txt 2>/dev/null || echo "")

              if [ -z "$DB_ID" ]; then
                echo "::error::D1 创建失败。请检查 CF_API_TOKEN 的 D1 编辑权限"
                exit 1
              fi
              echo "Created D1: $DB_ID"
            fi

            sed -i "s/database_id = .*/database_id = \"$DB_ID\"/" wrangler.toml
            NEED_COMMIT="yes"
          fi

          echo "D1 database_id: $DB_ID"
          echo "need_commit=$NEED_COMMIT" >> $GITHUB_OUTPUT

      - name: Initialize database schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute 9router-lite-db --file=./schema.sql --remote 2>&1 || true

      - name: Inject encryption key
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          if grep -qP '^\s*ENCRYPTION_KEY\s*=' wrangler.toml; then
            echo "ENCRYPTION_KEY already in wrangler.toml, skipping injection"
            exit 0
          fi
          if grep -q '\[vars\]' wrangler.toml; then
            sed -i "/\[vars\]/a\\ENCRYPTION_KEY = \"$ENCRYPTION_KEY\"" wrangler.toml
          else
            printf '\n[vars]\nENCRYPTION_KEY = "%s"\n' "$ENCRYPTION_KEY" >> wrangler.toml
          fi
          echo "Encryption key injected"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler pages deploy .

      - name: Commit database_id
        if: steps.d1.outputs.need_commit == 'yes'
        run: |
          sed -i '/^ENCRYPTION_KEY = /d' wrangler.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.toml
          git commit -m "chore: update D1 database_id [skip ci]"
          git push
