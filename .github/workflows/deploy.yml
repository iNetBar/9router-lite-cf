name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Setup D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          CLOUDFLARE_API_TOKEN="$(echo "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          CLOUDFLARE_ACCOUNT_ID="$(echo "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"

          echo "CF_API_TOKEN length: ${#CLOUDFLARE_API_TOKEN}"
          echo "CF_ACCOUNT_ID: $CLOUDFLARE_ACCOUNT_ID"

          # 1. 优先使用 D1_DATABASE_ID secret
          DB_ID="$D1_DATABASE_ID"

          # 2. 其次检查 wrangler.toml
          if [ -z "$DB_ID" ]; then
            DB_ID=$(grep -oP 'database_id\s*=\s*"\K[^"]+' wrangler.toml || echo "")
            if [ "$DB_ID" = "在此填入你的数据库ID" ]; then DB_ID=""; fi
          fi

          NEED_COMMIT="no"

          if [ -z "$DB_ID" ]; then
            # 3. 用 Python 脚本查询或创建 D1
            DB_ID=$(python3 scripts/d1_setup.py 2>&1 | tail -1)
            if [ -z "$DB_ID" ]; then
              echo "::error::D1 setup failed"
              exit 1
            fi
            sed -i "s/database_id = .*/database_id = \"$DB_ID\"/" wrangler.toml
            NEED_COMMIT="yes"
          fi

          echo "D1 database_id: $DB_ID"
          echo "need_commit=$NEED_COMMIT" >> $GITHUB_OUTPUT

      - name: Initialize database schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute 9router-lite-db --file=./schema.sql --remote 2>&1 || true

      - name: Inject encryption key
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          if grep -qP '^\s*ENCRYPTION_KEY\s*=' wrangler.toml; then
            echo "ENCRYPTION_KEY already in wrangler.toml, skipping injection"
            exit 0
          fi
          if grep -q '\[vars\]' wrangler.toml; then
            sed -i "/\[vars\]/a\\ENCRYPTION_KEY = \"$ENCRYPTION_KEY\"" wrangler.toml
          else
            printf '\n[vars]\nENCRYPTION_KEY = "%s"\n' "$ENCRYPTION_KEY" >> wrangler.toml
          fi
          echo "Encryption key injected"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create 9router-lite --production-branch=main 2>&1 || true
          npx wrangler pages deploy . --commit-dirty=true
