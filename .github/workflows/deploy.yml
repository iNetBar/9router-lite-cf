name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Setup D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          DB_ID=$(grep -oP 'database_id\s*=\s*"\K[^"]+' wrangler.toml || echo "")
          NEED_COMMIT="no"
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "在此填入你的数据库ID" ]; then
            echo "Creating D1 database ..."
            CREATE_OUT=$(npx wrangler d1 create 9router-lite-db 2>&1) || true
            DB_ID=$(echo "$CREATE_OUT" | grep -oP '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
            if [ -z "$DB_ID" ]; then
              echo "Database may already exist, listing ..."
              LIST_OUT=$(npx wrangler d1 list 2>&1)
              DB_ID=$(echo "$LIST_OUT" | grep -oP '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
            fi
            if [ -z "$DB_ID" ]; then
              echo "::error::无法创建或获取 D1 数据库 ID，请手动创建并设为 GitHub Secret D1_DATABASE_ID"
              exit 1
            fi
            sed -i "s/database_id = .*/database_id = \"$DB_ID\"/" wrangler.toml
            NEED_COMMIT="yes"
          fi
          echo "D1 database_id: $DB_ID"
          echo "need_commit=$NEED_COMMIT" >> $GITHUB_OUTPUT

      - name: Initialize database schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute 9router-lite-db --file=./schema.sql --remote 2>&1 || true

      - name: Inject encryption key
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          if grep -qP '^\s*ENCRYPTION_KEY\s*=' wrangler.toml; then
            echo "ENCRYPTION_KEY already in wrangler.toml, skipping injection"
            exit 0
          fi
          if grep -q '\[vars\]' wrangler.toml; then
            sed -i "/\[vars\]/a\\ENCRYPTION_KEY = \"$ENCRYPTION_KEY\"" wrangler.toml
          else
            printf '\n[vars]\nENCRYPTION_KEY = "%s"\n' "$ENCRYPTION_KEY" >> wrangler.toml
          fi
          echo "Encryption key injected"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler pages deploy .

      - name: Commit database_id
        if: steps.d1.outputs.need_commit == 'yes'
        run: |
          sed -i '/^ENCRYPTION_KEY = /d' wrangler.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.toml
          git commit -m "chore: update D1 database_id [skip ci]"
          git push
